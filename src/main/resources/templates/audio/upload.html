<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Загрузка аудио')}"></head>
<body class="theme-page upload-page">
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<main class="container app-main narrow theme-form-main">
    <section class="form-surface theme-form-surface">
        <p class="section-kicker">Новый трек</p>
        <h1>Загрузка аудио</h1>
        <form th:action="@{/audio/upload}" th:object="${audioUploadDto}" method="post" enctype="multipart/form-data" class="vstack gap-3">
            <input th:if="${_csrf != null}" type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <div th:if="${#fields.hasGlobalErrors()}" class="alert alert-danger">
                <div th:each="err : ${#fields.globalErrors()}" th:text="${err}"></div>
            </div>
            <div>
                <label class="form-label" for="title">Название</label>
                <input class="form-control" id="title" th:field="*{title}">
                <div class="invalid-feedback d-block" th:errors="*{title}"></div>
            </div>
            <div>
                <label class="form-label" for="artist">Автор</label>
                <input class="form-control" id="artist" th:field="*{artist}">
                <div class="invalid-feedback d-block" th:errors="*{artist}"></div>
            </div>
            <div>
                <label class="form-label" for="genreId">Жанр</label>
                <select class="form-select" id="genreId" th:field="*{genreId}">
                    <option value="">Выберите жанр</option>
                    <option th:each="genre : ${genres}" th:value="${genre.id}" th:text="${genre.name}"></option>
                </select>
                <div class="invalid-feedback d-block" th:errors="*{genreId}"></div>
            </div>
            <div>
                <label class="form-label" for="description">Описание</label>
                <textarea class="form-control" id="description" rows="4" th:field="*{description}"></textarea>
                <div class="invalid-feedback d-block" th:errors="*{description}"></div>
            </div>
            <div>
                <label class="form-label" for="file">Файл</label>
                <input class="form-control" id="file" type="file" th:field="*{file}" accept=".mp3,.wav,.ogg,.m4a,audio/*">
                <div class="form-text">MP3, WAV, OGG или M4A, до 50 МБ.</div>
                <div class="invalid-feedback d-block" th:errors="*{file}"></div>
            </div>
            <div class="d-flex gap-2">
                <button class="btn theme-primary-btn" type="submit">Загрузить</button>
                <a class="btn theme-ghost-btn" th:href="@{/audio}">Отмена</a>
            </div>
        </form>
    </section>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
