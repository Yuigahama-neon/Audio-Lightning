<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="head(pageTitle)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${pageTitle} + ' | Audio Lightning'">Audio Lightning</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark app-navbar" th:fragment="navbar">
    <div class="container">
        <a class="navbar-brand fw-semibold" th:href="@{/}">Audio Lightning</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav"
                aria-controls="mainNav" aria-expanded="false" aria-label="Открыть навигацию">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div id="mainNav" class="collapse navbar-collapse">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                <li class="nav-item" sec:authorize="isAuthenticated()">
                    <a class="nav-link" th:href="@{/audio}">Аудиотека</a>
                </li>
                <li class="nav-item" sec:authorize="isAuthenticated()">
                    <a class="nav-link" th:href="@{/profile}">Профиль</a>
                </li>
                <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                    <a class="nav-link" th:href="@{/admin}">Админ</a>
                </li>
            </ul>
            <div class="d-flex gap-2 align-items-center">
                <a class="btn btn-outline-light btn-sm" sec:authorize="isAnonymous()" th:href="@{/login}">Войти</a>
                <a class="btn btn-light btn-sm" sec:authorize="isAnonymous()" th:href="@{/register}">Регистрация</a>
                <span class="navbar-text small" sec:authorize="isAuthenticated()">
                    <span sec:authentication="name">user</span>
                </span>
                <form sec:authorize="isAuthenticated()" th:action="@{/logout}" method="post">
                    <input th:if="${_csrf != null}" type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                    <button class="btn btn-outline-light btn-sm" type="submit">Выйти</button>
                </form>
            </div>
        </div>
    </div>
</nav>

<div th:fragment="alerts" class="alerts">
    <div th:if="${success}" class="alert alert-success" role="alert" th:text="${success}"></div>
    <div th:if="${error}" class="alert alert-danger" role="alert" th:text="${error}"></div>
</div>

<footer th:fragment="footer" class="app-footer">
    <div class="container d-flex flex-column flex-md-row gap-2 justify-content-between align-items-md-center">
        <span>Audio Lightning</span>
        <span class="text-muted footer-tech">Spring Boot, Thymeleaf, PostgreSQL</span>
        <nav class="home-socials" aria-label="Социальные сети">
            <a href="#" aria-label="VK">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <text x="3" y="16.5" font-size="8.5" font-weight="800">VK</text>
                </svg>
            </a>
            <a href="#" aria-label="Discord">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M7.6 8.2c2.8-1.1 6-1.1 8.8 0l1.5 6.5c-1.7 1.2-3.1 1.7-4.4 1.9l-.6-1.1c.7-.2 1.3-.5 1.9-.9-1.8.8-3.8.8-5.6 0 .6.4 1.2.7 1.9.9l-.6 1.1c-1.3-.2-2.7-.7-4.4-1.9l1.5-6.5Z"/>
                    <circle cx="9.7" cy="12.2" r="1"/>
                    <circle cx="14.3" cy="12.2" r="1"/>
                </svg>
            </a>
            <a href="#" aria-label="Instagram">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <rect x="5.5" y="5.5" width="13" height="13" rx="3.6"/>
                    <circle cx="12" cy="12" r="3.2"/>
                    <circle cx="15.9" cy="8.2" r="0.9"/>
                </svg>
            </a>
            <a href="#" aria-label="Skype">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <circle cx="12" cy="12" r="6.7"/>
                    <text x="9" y="15.7" font-size="10" font-weight="800">S</text>
                </svg>
            </a>
            <a href="#" aria-label="Max">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <text x="3.2" y="16.2" font-size="7.6" font-weight="800">MAX</text>
                </svg>
            </a>
            <a href="#" aria-label="KakaoTalk">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M5 10.8c0-3.1 3.1-5.5 7-5.5s7 2.4 7 5.5-3.1 5.5-7 5.5c-.7 0-1.3-.1-1.9-.2L6.5 18l1.1-2.7C6 14.3 5 12.7 5 10.8Z"/>
                    <text x="9.4" y="13.5" font-size="7" font-weight="800">K</text>
                </svg>
            </a>
            <a href="#" aria-label="Z">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <text x="7.2" y="17" font-size="13" font-weight="900">Z</text>
                </svg>
            </a>
        </nav>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/player.js}"></script>
</footer>
</body>
</html>
