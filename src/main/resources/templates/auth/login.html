<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Вход')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<main class="container app-main narrow">
    <div th:replace="~{fragments/layout :: alerts}"></div>
    <section class="form-surface">
        <h1>Вход</h1>
        <div th:if="${param.error}" class="alert alert-danger">Неверный логин или пароль.</div>
        <div th:if="${param.logout}" class="alert alert-info">Вы вышли из аккаунта.</div>
        <form th:action="@{/login}" method="post" class="vstack gap-3">
            <input th:if="${_csrf != null}" type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <div>
                <label class="form-label" for="username">Имя пользователя или email</label>
                <input class="form-control" id="username" name="username" autocomplete="username" required>
            </div>
            <div>
                <label class="form-label" for="password">Пароль</label>
                <input class="form-control" id="password" name="password" type="password" autocomplete="current-password" required>
            </div>
            <button class="btn btn-primary" type="submit">Войти</button>
        </form>
        <p class="form-note">Нет аккаунта? <a th:href="@{/register}">Зарегистрироваться</a></p>
    </section>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
